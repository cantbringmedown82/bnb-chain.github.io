apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-ingress
  namespace: crypto-hound
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - crypto-hound.io
      secretName: site-tls
  rules:
    - host: crypto-hound.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
          - path: /create-checkout-session
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
          - path: /webhook
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
          - path: /evidence-index
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
          - path: /reports
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
