# Guardian Shield - Prometheus/Alertmanager Rules
# Fraud detection and compliance alert rules

groups:
  - name: fraud-alerts
    interval: 30s
    rules:
      - alert: CriticalFraudRiskDetected
        expr: fraud_risk_score > 0.95
        for: 1m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Critical fraud risk detected"
          description: "Fraud risk score {{ $value }} exceeds critical threshold (0.95)"
          runbook_url: "https://docs.cryptohound.io/runbooks/critical-fraud"
          
      - alert: HighFraudRiskDetected
        expr: fraud_risk_score > 0.8 and fraud_risk_score <= 0.95
        for: 2m
        labels:
          severity: high
          team: compliance
        annotations:
          summary: "High fraud risk detected"
          description: "Fraud risk score {{ $value }} exceeds high threshold (0.8)"
          
      - alert: MixerActivityDetected
        expr: mixer_transactions_count > 10
        for: 5m
        labels:
          severity: high
          type: mixer
        annotations:
          summary: "Suspicious mixer activity detected"
          description: "{{ $value }} mixer transactions detected in the last 5 minutes"
          
      - alert: UnusualExchangeVolume
        expr: exchange_volume_anomaly_score > 3
        for: 10m
        labels:
          severity: medium
          type: exchange
        annotations:
          summary: "Unusual exchange volume detected"
          description: "Exchange volume anomaly score {{ $value }} (>3 standard deviations)"

  - name: sla-alerts
    interval: 1m
    rules:
      - alert: SLAComplianceViolation
        expr: shield_sla_compliance_ratio < 0.99
        for: 5m
        labels:
          severity: critical
          team: operations
        annotations:
          summary: "SLA compliance below threshold"
          description: "SLA compliance ratio {{ $value | printf \"%.4f\" }} is below 99%"
          
      - alert: AlertResponseTimeSLABreach
        expr: histogram_quantile(0.95, rate(alert_response_time_bucket[5m])) > 30
        for: 5m
        labels:
          severity: high
          team: operations
        annotations:
          summary: "Alert response time SLA breach"
          description: "P95 alert response time {{ $value }}s exceeds 30s SLA"

  - name: evidence-ledger-alerts
    interval: 1m
    rules:
      - alert: EvidenceLedgerWriteFailure
        expr: rate(evidence_write_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Evidence ledger write failures detected"
          description: "{{ $value }} evidence write errors in the last 5 minutes"
          
      - alert: BlockchainAnchorDelayed
        expr: time() - evidence_last_anchor_timestamp > 7200
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Blockchain anchoring delayed"
          description: "Last anchor was {{ $value | humanizeDuration }} ago (threshold: 2h)"
          
      - alert: HashChainIntegrityError
        expr: evidence_hash_chain_valid == 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Evidence hash chain integrity violation"
          description: "Hash chain validation failed - potential tampering detected"

  - name: drill-alerts
    interval: 5m
    rules:
      - alert: SyntheticDrillFailure
        expr: rate(drill_failures_total[1h]) > 0.1
        for: 15m
        labels:
          severity: medium
          team: operations
        annotations:
          summary: "Synthetic drill failure rate elevated"
          description: "Drill failure rate {{ $value | printf \"%.2f\" }} exceeds threshold"
          
      - alert: DrillExecutionMissed
        expr: time() - drill_last_execution_timestamp > 18000
        for: 5m
        labels:
          severity: medium
          team: operations
        annotations:
          summary: "Scheduled drill execution missed"
          description: "Last drill execution was {{ $value | humanizeDuration }} ago"

  - name: system-health-alerts
    interval: 30s
    rules:
      - alert: OrchestratorDown
        expr: up{job="shield-orchestrator"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Shield Orchestrator is down"
          description: "Shield Orchestrator instance {{ $labels.instance }} is not responding"
          
      - alert: AgentUnhealthy
        expr: shield_agent_health == 0
        for: 2m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Shield Agent unhealthy"
          description: "Agent {{ $labels.agent }} is reporting unhealthy status"
          
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 400
        for: 5m
        labels:
          severity: medium
          team: platform
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage {{ $value | printf \"%.0f\" }}MB exceeds threshold"

  - name: regulator-notifications
    interval: 1m
    rules:
      - alert: RegulatorReportDue
        expr: time() - regulator_last_report_timestamp > 604800
        for: 1h
        labels:
          severity: high
          team: compliance
          notify: regulator
        annotations:
          summary: "Regulator report overdue"
          description: "Weekly regulator report has not been generated in {{ $value | humanizeDuration }}"
          
      - alert: WatchlistMatch
        expr: increase(watchlist_matches_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: compliance
          notify: regulator
        annotations:
          summary: "Watchlist match detected"
          description: "{{ $value }} watchlist matches detected in the last hour"

# Alertmanager route configuration
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        notify: regulator
      receiver: 'regulator-channel'
    - match:
        severity: high
      receiver: 'high-priority'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://shield-orchestrator:8080/alerts'
        
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://shield-orchestrator:8080/alerts/critical'
    email_configs:
      - to: 'security@cryptohound.io'
        send_resolved: true
        
  - name: 'regulator-channel'
    webhook_configs:
      - url: 'http://shield-orchestrator:8080/alerts/regulator'
        
  - name: 'high-priority'
    slack_configs:
      - channel: '#shield-alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'medium'
    equal: ['alertname']
