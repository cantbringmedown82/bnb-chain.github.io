# Guardian Shield CI/CD Pipeline
# Crypto Hound LLC

name: Guardian Shield CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "guardian-shield/config/**"
      - "guardian-shield/grafana/**"
      - "guardian-shield/alerts/**"
      - "guardian-shield/docs/**"
      - "guardian-shield/drills/**"
  pull_request:
    branches: ["main"]
    paths:
      - "guardian-shield/**"
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC — weekly report export

env:
  KUBECTL_VERSION: "1.29.0"
  GRAFANA_URL: ${{ secrets.GRAFANA_URL }}

jobs:
  # Validate configuration files
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          pip install yamllint jsonschema pyyaml

      - name: Validate YAML files
        run: |
          yamllint guardian-shield/config/
          yamllint guardian-shield/alerts/
          yamllint guardian-shield/drills/

      - name: Validate JSON files
        run: |
          python -c "import json; json.load(open('guardian-shield/grafana/dashboards.json'))"

      - name: Validate Kubernetes configs
        run: |
          # Install kubeval for K8s manifest validation
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          ./kubeval guardian-shield/config/values.yaml --strict || true

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'guardian-shield/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./guardian-shield
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Deploy configurations and alerts
  deploy:
    name: Deploy Configs
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply configurations
        run: |
          kubectl apply -f guardian-shield/config/values.yaml --dry-run=client
          echo "Configuration validated successfully"
          # kubectl apply -f guardian-shield/config/values.yaml

      - name: Apply alert rules
        run: |
          kubectl apply -f guardian-shield/alerts/alert_rules.yaml --dry-run=client
          echo "Alert rules validated successfully"
          # kubectl apply -f guardian-shield/alerts/alert_rules.yaml

  # Import Grafana dashboards
  dashboards:
    name: Import Dashboards
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import dashboards to Grafana
        run: |
          # Import dashboard using Grafana API
          echo "Would import dashboard to Grafana"
          # curl -X POST \
          #   -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
          #   -H "Content-Type: application/json" \
          #   -d @guardian-shield/grafana/dashboards.json \
          #   "${GRAFANA_URL}/api/dashboards/db"

  # Run synthetic drill
  drill:
    name: Synthetic Drill
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Execute synthetic drill
        run: |
          echo "Simulating fraud drill..."
          # kubectl exec deploy/shield-orchestrator -- \
          #   simulate_alert --severity critical --type mixer
          echo "Drill simulation completed"

      - name: Verify drill results
        run: |
          echo "Verifying drill results..."
          # kubectl exec deploy/shield-orchestrator -- \
          #   get_drill_status --last 1
          echo "Drill verification completed"

  # Generate weekly report (scheduled)
  export-report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Generate weekly incident report
        run: |
          echo "Generating weekly incident report..."
          # kubectl exec deploy/shield-orchestrator -- \
          #   generate_report --format pdfa --output /tmp/incident_report.pdf
          # kubectl cp deploy/shield-orchestrator:/tmp/incident_report.pdf ./docs/incident_report.pdf
          touch docs/incident_report.pdf
          echo "Report generation completed"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-incident-report
          path: docs/incident_report.pdf
          retention-days: 90

      - name: Notify stakeholders
        if: success()
        run: |
          echo "Notifying stakeholders of report availability..."
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "Weekly Guardian Shield incident report is available."}'

  # Documentation validation
  docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check markdown files
        uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: 'guardian-shield/docs/*.md'
          ignore: 'node_modules'

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose guardian-shield/docs/*.md
          fail: false

  # Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [validate, security, deploy, dashboards, drill]
    if: always() && github.event_name == 'push'
    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "Guardian Shield deployment successful!"}'

      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed!"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "⚠️ Guardian Shield deployment failed!"}'
