stages:
  - lint
  - test
  - security
  - build
  - deploy
  - drill

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: ${CI_PROJECT_PATH}/guardian-shield
  NODE_VERSION: "20"

default:
  image: node:${NODE_VERSION}-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# ============================================================================
# LINT STAGE
# ============================================================================

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
  only:
    - merge_requests
    - main
    - staging

# ============================================================================
# TEST STAGE
# ============================================================================

unit-tests:
  stage: test
  script:
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: junit.xml
  only:
    - merge_requests
    - main
    - staging

e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  script:
    - npm ci
    - npx playwright install
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# ============================================================================
# SECURITY STAGE
# ============================================================================

dependency-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
  allow_failure: true
  only:
    - merge_requests
    - main

sast:
  stage: security
  image: 
    name: returntocorp/semgrep
    entrypoint: [""]
  script:
    - semgrep --config auto --json --output semgrep-results.json .
  artifacts:
    paths:
      - semgrep-results.json
    reports:
      sast: semgrep-results.json
  only:
    - merge_requests
    - main

# ============================================================================
# BUILD STAGE
# ============================================================================

build-image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build -t ${CI_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA} .
    - docker push ${CI_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}
    - |
      if [ "${CI_COMMIT_BRANCH}" == "main" ]; then
        docker tag ${CI_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA} ${CI_REGISTRY}/${IMAGE_NAME}:latest
        docker push ${CI_REGISTRY}/${IMAGE_NAME}:latest
      fi
  only:
    - main
    - staging

# ============================================================================
# DEPLOY STAGE
# ============================================================================

deploy-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.guardian-shield.cryptohound.io
  script:
    - kubectl config use-context ${KUBE_CONTEXT_STAGING}
    - kubectl set image deployment/guardian-shield 
        guardian-shield=${CI_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA} 
        -n guardian-shield-staging
    - kubectl rollout status deployment/guardian-shield -n guardian-shield-staging
  only:
    - staging

deploy-production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://guardian-shield.cryptohound.io
  script:
    - kubectl config use-context ${KUBE_CONTEXT_PRODUCTION}
    - kubectl set image deployment/guardian-shield 
        guardian-shield=${CI_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA} 
        -n guardian-shield-production
    - kubectl rollout status deployment/guardian-shield -n guardian-shield-production
  only:
    - main
  when: manual

# ============================================================================
# DRILL STAGE
# ============================================================================

synthetic-drill:
  stage: drill
  image: python:3.12-slim
  script:
    - pip install guardian-drill-runner
    - guardian-drill run 
        --config drills/fraud_event_generator.yaml 
        --schedule drills/drill_schedule.yaml 
        --output drill-results.json
  artifacts:
    paths:
      - drill-results.json
    expire_in: 1 month
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

weekly-report:
  stage: drill
  image: python:3.12-slim
  script:
    - pip install guardian-export-tools
    - guardian-export generate 
        --type weekly 
        --format pdfa 
        --output reports/weekly-$(date +%Y%m%d).pdf
    - guardian-export email 
        --report reports/weekly-$(date +%Y%m%d).pdf 
        --recipients ${REPORT_RECIPIENTS}
  artifacts:
    paths:
      - reports/
    expire_in: 1 year
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ============================================================================
# SCHEDULED PIPELINES
# ============================================================================

# Configure in GitLab UI:
# - Weekly drill: cron "0 6 * * 1" (Monday 06:00 UTC)
# - Weekly report: cron "0 6 * * 1" (Monday 06:00 UTC)
