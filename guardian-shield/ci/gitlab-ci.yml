# Guardian Shield CI/CD Pipeline - GitLab CI

stages:
  - lint
  - test
  - security
  - build
  - deploy-staging
  - deploy-production

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_PREFIX: ${CI_PROJECT_PATH}/guardian-shield
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

# Cache configurations
.python-cache: &python-cache
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - venv/

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/

# Template for Docker builds
.docker-build: &docker-build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# Lint jobs
lint-python:
  stage: lint
  image: python:${PYTHON_VERSION}
  <<: *python-cache
  script:
    - pip install ruff mypy
    - ruff check backend/
    - mypy backend/ --ignore-missing-imports
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

lint-typescript:
  stage: lint
  image: node:${NODE_VERSION}
  <<: *node-cache
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

# Test jobs
test-backend:
  stage: test
  image: python:${PYTHON_VERSION}
  <<: *python-cache
  services:
    - postgres:16
    - redis:7
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: shield_test
    DATABASE_URL: postgresql://test:test@postgres:5432/shield_test
    REDIS_URL: redis://redis:6379
    JWT_SECRET: test-secret
  script:
    - cd backend
    - pip install -e ".[test]"
    - pytest --cov=app --cov-report=xml --cov-report=html -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

test-frontend:
  stage: test
  image: node:${NODE_VERSION}
  <<: *node-cache
  script:
    - cd frontend
    - npm ci
    - npm run test -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

# Security scanning
security-sast:
  stage: security
  image: returntocorp/semgrep
  script:
    - semgrep scan --config=p/security-audit --config=p/python --config=p/typescript .
  artifacts:
    reports:
      sast: gl-sast-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

security-container:
  stage: security
  image: aquasec/trivy
  script:
    - trivy fs --exit-code 1 --severity CRITICAL,HIGH .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

dependency-scanning:
  stage: security
  image: python:${PYTHON_VERSION}
  script:
    - pip install pip-audit
    - pip-audit -r backend/requirements.txt
    - cd frontend && npm audit --audit-level=high
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

# Build jobs
.build-template:
  stage: build
  <<: *docker-build
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}/${COMPONENT}:${CI_COMMIT_SHA} -f docker/${COMPONENT}.Dockerfile .
    - docker push ${CI_REGISTRY_IMAGE}/${COMPONENT}:${CI_COMMIT_SHA}
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${CI_REGISTRY_IMAGE}/${COMPONENT}:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}/${COMPONENT}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}/${COMPONENT}:${CI_COMMIT_TAG}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

build-orchestrator:
  extends: .build-template
  variables:
    COMPONENT: orchestrator

build-evidence-api:
  extends: .build-template
  variables:
    COMPONENT: evidence-api

build-fraud-monitor:
  extends: .build-template
  variables:
    COMPONENT: fraud-monitor

build-report-exporter:
  extends: .build-template
  variables:
    COMPONENT: report-exporter

build-frontend:
  extends: .build-template
  variables:
    COMPONENT: frontend

# Staging deployment
deploy-staging:
  stage: deploy-staging
  image: alpine/helm:3
  environment:
    name: staging
    url: https://staging.shield.cryptohound.io
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/stable.txt"
    - curl -LO "https://dl.k8s.io/release/$(cat stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "${STAGING_KUBECONFIG}" | base64 -d > kubeconfig
  script:
    - |
      helm upgrade --install guardian-shield ./helm \
        --namespace guardian-shield \
        --create-namespace \
        --kubeconfig kubeconfig \
        -f ./helm/values-staging.yaml \
        --set global.image.tag=${CI_COMMIT_SHA} \
        --wait --timeout 10m
    - ./scripts/smoke-test.sh staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  needs:
    - build-orchestrator
    - build-evidence-api
    - build-fraud-monitor
    - build-report-exporter
    - build-frontend

# Production deployment
deploy-production:
  stage: deploy-production
  image: alpine/helm:3
  environment:
    name: production
    url: https://shield.cryptohound.io
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/stable.txt"
    - curl -LO "https://dl.k8s.io/release/$(cat stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - echo "${PRODUCTION_KUBECONFIG}" | base64 -d > kubeconfig
  script:
    - |
      helm upgrade --install guardian-shield ./helm \
        --namespace guardian-shield \
        --kubeconfig kubeconfig \
        -f ./helm/values-production.yaml \
        --set global.image.tag=${CI_COMMIT_TAG} \
        --wait --timeout 15m
    - ./scripts/smoke-test.sh production
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  needs:
    - build-orchestrator
    - build-evidence-api
    - build-fraud-monitor
    - build-report-exporter
    - build-frontend

# Pages for documentation
pages:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - pip install mkdocs mkdocs-material
    - mkdocs build -d public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
